name: FIB bot
on: {schedule: [{cron: "40 * * * 1-5"}], workflow_dispatch: {}}
jobs: {run: {runs-on: ubuntu-latest, steps: [{uses: actions/checkout@v4}, {uses: actions/setup-python@v5, with: {python-version: "3.11"}}, {run: python fib_bot.py, env: {TELEGRAM_TOKEN: "${{ secrets.TELEGRAM_TOKEN }}", TELEGRAM_CHAT_ID: "${{ secrets.TELEGRAM_CHAT_ID }}"}}]}}
