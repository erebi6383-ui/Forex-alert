name: forex-alerts
on:
  schedule:
    - cron: "5 * * * 1-5"
  workflow_dispatch:
jobs:
  alert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas numpy requests websocket-client
      - run: python alert_bot.py ${{ github.event_name == 'workflow_dispatch' && 'status' || 'alert' }}
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
